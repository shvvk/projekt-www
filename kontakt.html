<!doctype html>
<html lang="pl">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Sklep internetowy - Kontakt</title>
        <meta name="description" content="Sklep internetowy - kontakt">
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <header class="site-header">
            <a class="logo" href="index.html">Sklep</a>
            <nav class="site-nav" aria-label="Nawigacja główna">
                <a href="index.html">Strona główna</a>
                <a href="oferta.html">Oferta</a>
                <a href="kontakt.html">Kontakt</a>
                <a href="page3.html">Blog</a>
            </nav>
        </header>
        <main class="site-main">
            <h1 id="title">Kontakt</h1>
            <section class="content" aria-label="Dane kontaktowe">
                <h2>Dane kontaktowe</h2>
                <p>Leśna 63, 42-134 Hutka</p>
                <p>Telefon: 123 456 789</p>
                <p>E-mail: kontakt@sklep.pl</p>
            </section>
            <section class="content" aria-label="Formularz kontaktowy">
                <h2>Formularz kontaktowy</h2>
                <form action="kontakt.html" method="post">
                    <label for="name">Imię</label>
                    <input type="text" id="name" name="name" required minlength="3" maxlength="50">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email">
                    
                    <label for="topic">Temat</label><br>
                    <select id="topic" name="topic" required>
                    <option value="">-- wybierz --</option>
                    <option value="question">Pytanie</option>
                    <option value="cooperation">Współpraca</option>
                    <option value="other">Inne</option>
                    </select>
                    <label for="message">Wiadomość</label>
                    <textarea id="message" name="message" rows="5" required minlength="10"></textarea>
                    <label>
                    <input type="checkbox" name="consent" value="yes" required>
                    Zgadzam się z regulaminem i polityką prywatności sklepu 
                    </label>
                    <button type="submit">Send</button>
                </form>
            </section>
            <section class="content" aria-label="Newsletter">
                <h2>Zapis do newslettera</h2>
                <form>
                    <label for="newsletter-email">E-mail</label>
                    <input type="email" id="newsletter-email" name="newsletter-email">
                    <button type="submit">Zapisz się</button>
                </form>
            </section>
        </main>
        <footer class="site-footer">
            <p>&copy; 2026 Sklep. Wszelkie prawa zastrzeżone.</p>
        </footer>
    </body>
</html>
